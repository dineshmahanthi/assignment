<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PopX - Login</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

    <div class="form-header">
        <h2>Signin to your<br>PopX account</h2>
        <p class="subtitle">Lorem ipsum dolor sit amet,<br>consectetur adipiscing elit,</p>
    </div>

    <form class="form-content login-form">
        <div class="input-group">
            <label class="required">Email Address</label>
            <input type="email" placeholder="Enter email address">
        </div>

        <div class="input-group">
            <label class="required">Password</label>
            <input type="password" placeholder="Enter password">
        </div>

        <a href="profile.html" class="btn-primary" style="display:block;text-align:center;text-decoration:none;">Login</a>
    </form>

</div>

</body>
</html>
