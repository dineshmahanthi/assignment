<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PopX - Create Account</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

    <div class="form-header">
        <h2>Create your<br>PopX account</h2>
    </div>

    <form class="form-content">
        <div class="input-group">
            <label class="required">Full Name</label>
            <input type="text" placeholder="Marry Doe">
        </div>

        <div class="input-group">
            <label class="required">Phone number</label>
            <input type="tel" placeholder="Marry Doe">
        </div>

        <div class="input-group">
            <label class="required">Email address</label>
            <input type="email" placeholder="Marry Doe">
        </div>

        <div class="input-group">
            <label class="required">Password</label>
            <input type="password" placeholder="Marry Doe">
        </div>

        <div class="input-group">
            <label class="required">Company name</label>
            <input type="text" placeholder="Marry Doe">
        </div>

        <div class="radio-group">
            <span>Are you an Agency?<span class="required-star">*</span></span>
            <div class="radio-options">
                <label class="radio-label">
                    <input type="radio" name="agency" value="yes" checked>
                    <span class="radio-custom"></span>
                    Yes
                </label>
                <label class="radio-label">
                    <input type="radio" name="agency" value="no">
                    <span class="radio-custom"></span>
                    No
                </label>
            </div>
        </div>

        <a href="profile.html" class="btn-primary" style="display:block;text-align:center;text-decoration:none;">Create Account</a>
    </form>

</div>

</body>
</html>
